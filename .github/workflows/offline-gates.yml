# Offline proof for the Beatitude Engine. No model or Supabase keys.
# Matches the README: pytest, worker npm test, eval harness --mock.
name: Offline gates

on:
  pull_request:
  push:
    branches:
      - claude/beatitude-engine-service-en16cv

permissions:
  contents: read

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python3 -m venv .venv && .venv/bin/pip install -e ".[dev]"
      - name: pytest
        run: .venv/bin/python -m pytest tests/ -q

  worker:
    name: worker npm test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Worker contract tests
        working-directory: worker
        run: npm test

  eval-harness:
    name: eval harness mock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Mock harness
        working-directory: eval
        run: python3 harness.py --mock
