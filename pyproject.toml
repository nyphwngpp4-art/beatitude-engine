[project]
name = "beatitude-engine"
version = "0.1.0"
description = "Beatitude Engine — values-review service for Agavi AI"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.69",
    "openai>=1.55",
    "httpx>=0.27",
    "mcp>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
